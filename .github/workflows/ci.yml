name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  node-tests:
    name: TypeScript and Feature Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Module 4 feature engineering tests
        run: node --test tests/module4-feature-engineering.test.mjs
      - name: Full Node test suite
        run: node --test tests/*.mjs
      - name: Module 3 verification
        run: node scripts/verify-module3.mjs

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      ML_SERVICE_URL: http://localhost:8000
      ML_SERVICE_API_KEY: ci-placeholder
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: llama-3.3-70b-versatile
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  ml-tests:
    name: Python ML Pipeline Tests
    runs-on: ubuntu-latest
    # Test-only secret: the ML service fails closed at import time when
    # ML_SERVICE_API_KEY is unset (see ml-service/config.py). This is a
    # CI placeholder, never a production value, and it is not committed to .env.
    env:
      ML_SERVICE_API_KEY: ci-test-only-key-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: pip install -r ml-service/requirements.txt
      - name: Verify XGBoost dependency
        run: python -c "import xgboost; print(f'xgboost {xgboost.__version__}')"
      - name: Run ML pipeline tests
        run: python ml-service/test_pipeline.py
      - name: Run ML authentication and security tests
        run: python ml-service/test_auth_security.py
